ServerName fixa
ServerTokens Prod
ServerSignature Off

<VirtualHost *:${PORT}>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
    </Directory>

    # Comprime el texto. Incluye el JSON de Livewire: cada clic del panel responde con uno.
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/plain text/css text/javascript application/javascript application/json image/svg+xml
    </IfModule>

    # Caché del navegador para los archivos estáticos. Los que llevan ?v= (recurso() y los de
    # Filament) cambian de URL cuando cambian, así que pueden guardarse un año sin volver a pedirse.
    <LocationMatch "^/(css|js|fonts|images|movil)/">
        <If "%{QUERY_STRING} =~ /(^|&)v=/">
            Header set Cache-Control "public, max-age=31536000, immutable"
        </If>
        <Else>
            Header set Cache-Control "public, max-age=604800"
        </Else>
    </LocationMatch>

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
