# Base local para desarrollar: las consultas no viajan hasta Supabase.
# Toma los datos DB_* del .env y solo acepta conexiones desde esta PC.
services:
  db:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:?}
      POSTGRES_USER: ${DB_USERNAME:?}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?}
    ports:
      - "127.0.0.1:${DB_PORT:?}:5432"
    volumes:
      - fixa_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  fixa_db:
